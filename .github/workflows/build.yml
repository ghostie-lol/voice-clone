name: Build and release

# Push a tag like v1.0.0 to build everything and publish APK, EXE and IPA to GitHub Releases.
# Run manually (Actions tab) to build without releasing.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- Android
  android:
    runs-on: ubuntu-latest
    env:
      APP_ORG: ${{ vars.APP_ORG }}
      SERVER_URL: ${{ vars.SERVER_URL }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Validate app identifier
        shell: bash
        run: |
          if [[ -z "$APP_ORG" || "$APP_ORG" == "com.example" ]]; then
            echo "::error::Set the APP_ORG repository variable to your reverse-domain app ID (for example, com.yourname.voiceclone)."
            exit 1
          fi
      - name: Generate platform folder
        run: flutter create --platforms=android --project-name voice_clone --org "$APP_ORG" .
      - name: Patch Android (permissions, minSdk, server URL)
        run: |
          CLEAR=' android:usesCleartextTraffic="true"'
          if [[ "$SERVER_URL" == https://* ]]; then CLEAR=''; fi
          sed -i "s#<application#<uses-permission android:name=\"android.permission.INTERNET\"/><uses-permission android:name=\"android.permission.RECORD_AUDIO\"/><application${CLEAR}#" android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true
          if [ -n "$SERVER_URL" ]; then sed -i "s#http://10.0.2.2:8000#$SERVER_URL#" lib/main.dart; fi
      - name: Set up release signing (keeps the same signature across updates)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          python3 - <<'PY'
          p = "android/app/build.gradle.kts"
          s = open(p).read()
          block = "\n".join([
              "    signingConfigs {",
              '        create("release") {',
              '            storeFile = file(System.getenv("KEYSTORE_PATH"))',
              '            storePassword = System.getenv("KEYSTORE_PASSWORD")',
              '            keyAlias = System.getenv("KEY_ALIAS")',
              '            keyPassword = System.getenv("KEY_PASSWORD")',
              "        }",
              "    }",
              "",
              "",
          ])
          s = s.replace("    buildTypes {", block + "    buildTypes {", 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          open(p, "w").write(s)
          PY
      - name: Upgrade affected plugins
        run: flutter pub upgrade record share_plus
      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: VoiceClone-pubspec-lock
          path: pubspec.lock
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk VoiceClone-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceClone-android
          path: VoiceClone-android.apk
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VoiceClone-android.apk
          generate_release_notes: true

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    env:
      APP_ORG: ${{ vars.APP_ORG }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Validate app identifier
        shell: bash
        run: |
          if [[ -z "$APP_ORG" || "$APP_ORG" == "com.example" ]]; then
            echo "::error::Set the APP_ORG repository variable to your reverse-domain app ID (for example, com.yourname.voiceclone)."
            exit 1
          fi
      - name: Generate platform folder
        run: flutter create --platforms=windows --project-name voice_clone --org "$env:APP_ORG" .
      - name: Set server URL
        shell: bash
        run: |
          if [ -n "$SERVER_URL" ]; then sed -i "s#http://10.0.2.2:8000#$SERVER_URL#" lib/main.dart; fi
      - name: Upgrade affected plugins
        run: flutter pub upgrade record share_plus
      - run: flutter build windows --release
      - name: Zip
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath VoiceClone-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceClone-windows
          path: VoiceClone-windows.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VoiceClone-windows.zip
          generate_release_notes: true

  # -------------------------------------------------------------------- iOS
  # Unsigned IPA. Users install it with AltStore or Sideloadly using a free Apple ID.
  ios:
    runs-on: macos-latest
    env:
      APP_ORG: ${{ vars.APP_ORG }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
      - name: Validate app identifier
        shell: bash
        run: |
          if [[ -z "$APP_ORG" || "$APP_ORG" == "com.example" ]]; then
            echo "::error::Set the APP_ORG repository variable to your reverse-domain app ID (for example, com.yourname.voiceclone)."
            exit 1
          fi
      - name: Generate platform folder
        run: flutter create --platforms=ios --project-name voice_clone --org "$APP_ORG" .
      - name: Upgrade affected plugins
        run: flutter pub upgrade record share_plus
      - name: Patch iOS (permissions, unsigned signing, server URL)
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Record a voice sample to clone" ios/Runner/Info.plist
          cd ios && pod install && cd ..
          python3 - <<'PY'
          from pathlib import Path
          import re

          projects = [
              Path("ios/Runner.xcodeproj/project.pbxproj"),
              Path("ios/Pods/Pods.xcodeproj/project.pbxproj"),
          ]
          settings = (
              "\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n"
              "\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n"
              '\t\t\t\tCODE_SIGN_IDENTITY = "";\n'
              '\t\t\t\tDEVELOPMENT_TEAM = "";\n'
          )
          for project in projects:
              if not project.exists():
                  continue
              contents = project.read_text()
              contents, count = re.subn(
                  r"(buildSettings = \{\n)",
                  lambda match: match.group(1) + settings,
                  contents,
              )
              if count == 0:
                  raise SystemExit(f"Could not find Xcode build settings in {project}")
              project.write_text(contents)
              print(f"Disabled code signing in {count} configurations: {project}")
          PY
          if [ -n "$SERVER_URL" ]; then sed -i '' "s#http://10.0.2.2:8000#$SERVER_URL#" lib/main.dart; fi
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          flutter build ipa --release --no-codesign --build-number=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
          cp build/ios/ipa/*.ipa VoiceClone-ios-unsigned.ipa
      - name: Upload iOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceClone-ios-build-log
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceClone-ios-unsigned
          path: VoiceClone-ios-unsigned.ipa
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VoiceClone-ios-unsigned.ipa
          generate_release_notes: true
